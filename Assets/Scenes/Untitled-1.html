<!DOCTYPE html>
<html>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<body>

<div class="box"></div>

<style>
  .box {
    width: 100px;
    height: 100px;
    background: tomato;
    margin: 50px;
  }
</style>

<script>
   // Create a timeline
   const tl = gsap.timeline();
  
  // Add sequential animations
  tl.to(".box", {  x: 200, y: 100, duration: 1 })
    .to(".box", {  x: -100, y: -50, duration: 1 })
    .to(".box", { rotation: 90, duration: 1 });
  
 
  
</script>

</body>
</html>
